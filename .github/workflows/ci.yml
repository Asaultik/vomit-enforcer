name: ci

on:
  push:
  pull_request:

jobs:
  # Everything that runs on a PC: the three library crates and the simulator.
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, thumbv6m-none-eabi
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The libraries must build without std for both chips.
      - run: cargo build --release -p vomit-core -p vomit-link -p vomit-ctap --target thumbv7em-none-eabihf
      - run: cargo build --release -p vomit-link --target thumbv6m-none-eabi

  # Real FIDO clients against the simulator.
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libfido2-1
      # Argon2id landed in cryptography 44.
      - run: pip install "cryptography>=44" "fido2>=2,<3"
      - run: cargo build -p vomit-sim
      - run: python -m unittest discover -s tests -v
      - run: python tools/kat.py --check

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [fw-core, fw-bridge, bench]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, thumbv6m-none-eabi
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release
