name: ci

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: vomit-core
      - run: rustup target add thumbv7em-none-eabihf && cargo build --target thumbv7em-none-eabihf
        working-directory: vomit-core
