[package]
name = "vomit-enforcer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[features]
default = ["input-dial"]
# Potentiometer / analog hall dial + one insert button.
input-dial = []
# 3x4 phone keypad.
input-keypad = []

[dependencies]
vomit-core = { path = "../vomit-core" }

embassy-stm32 = { version = "0.6", features = ["stm32f411ce", "time-driver-tim2", "exti", "unstable-pac", "memory-x"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5" }
embassy-usb = { version = "0.6" }
embassy-futures = "0.1"
embassy-sync = "0.8"
usbd-hid = "0.10"

cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1"
static_cell = "2"
zeroize = { version = "1.8", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 2
panic = "abort"

[profile.dev]
opt-level = 1
panic = "abort"
