[package]
name = "vomit-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Hardware-independent logic for vomit-enforcer: PIN entry, key derivation, passphrase rendering, HID keymap."

[dependencies]
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["derive"] }
