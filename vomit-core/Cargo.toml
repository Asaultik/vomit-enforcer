[package]
name = "vomit-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Crypto core for vomit-enforcer: PIN-locked seed vault with throttling, wipe and key rotation, passphrase derivation."

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["zeroize"] }
chacha20 = { version = "0.9", features = ["zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false }
hkdf = "0.12"
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["derive"] }
